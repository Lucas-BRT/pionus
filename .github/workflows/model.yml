name: Model

# Exports each OpenVINO model with scripts/export-model.sh, which fails unless
# the result is byte for byte its manifest in scripts/export/: this proves the
# export reproduces on another machine, as every user's machine exports it
# (pionus hosts no models). Run by hand after changing the pinned
# export.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen2.5-coder-1.5b
            name: qwen2.5-coder-1.5b-instruct-int4-sym-g128
          - model: pionus-1.5b-v0.3
            name: pionus-1.5b-v0.3-int4-sym-g128
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Make room (the export needs about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Export (fails if not identical to the committed manifest)
        run: scripts/export-model.sh --model "${{ matrix.model }}" "$RUNNER_TEMP/models/${{ matrix.name }}"
      - name: Keep the differing export for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-mismatch-${{ matrix.model }}
          path: |
            ${{ runner.temp }}/models/*.partial/*.json
            ${{ runner.temp }}/models/*.partial/*.xml
            ${{ runner.temp }}/models/*.partial/MANIFEST.sha256
          retention-days: 7
