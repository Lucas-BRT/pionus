[package]
name = "pionus-training"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The data tools for training pionus's models; not part of the release"
publish = false

[[bin]]
name = "pionus-training"
path = "src/main.rs"

[dependencies]
# The models of the registry, which the Kaggle bundles pin their downloads to.
pionus = { path = "../../cli" }
anyhow.workspace = true
clap.workspace = true
fancy-regex = "0.20"
glob = "0.3"
parquet = { version = "60", default-features = false, features = ["snap", "flate2-zlib-rs", "zstd", "lz4", "brotli"] }
regex = "1"
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
unicode-normalization = "0.1"
