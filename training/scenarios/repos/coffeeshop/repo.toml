# A coffee shop's order system: Python, English identifiers and history,
# free style (no prefixes), informal like many student projects.
convention = "free"

[[commit]]
message = "initial commit"
paths = ["README.md", "requirements.txt", ".gitignore", "src/coffeeshop/__init__.py"]

[[commit]]
message = "menu with prices"
paths = ["src/coffeeshop/menu.py"]

[[commit]]
message = "add orders"
paths = ["src/coffeeshop/order.py", "src/coffeeshop/config.py"]

[[commit]]
message = "stock control in sqlite"
paths = ["src/coffeeshop/stock.py"]

[[commit]]
message = "order tests"
paths = ["tests/test_order.py"]

[[commit]]
message = "basic cli with order and report"
paths = ["src/coffeeshop/cli.py"]

[[commit]]
message = "text receipt and day summary"
paths = ["src/coffeeshop/report.py", "templates/receipt.txt"]

[[commit]]
message = "fix cappuccino price"
ops = [{ op = "replace", path = "src/coffeeshop/menu.py", old = "11.00", new = "12.00" }]

[[commit]]
message = "database backup script"
paths = ["scripts/backup.sh"]

[[commit]]
message = "configurable service fee and other minor tweaks"
ops = [
  { op = "replace", path = "src/coffeeshop/config.py", old = "service_fee: float = 0.10", new = "service_fee: float = 0.12" },
  { op = "replace", path = "tests/test_order.py", old = "== 13.2", new = "== 13.44" },
  { op = "replace", path = "tests/test_order.py", old = "9 * 1.1 * 0.7", new = "9 * 1.12 * 0.7" },
]
