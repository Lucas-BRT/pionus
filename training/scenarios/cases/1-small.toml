# Level 1: one file, one to five lines, with code meaning.
level = 1

[[case]]
id = "config-value"
title = "changes a configuration value"
repo = "coffeeshop"
split = "train"
ops = [{ op = "replace", path = "src/coffeeshop/config.py", old = "{{old}}", new = "{{new}}" }]
target = "{{target}}"
tags = ["config"]

  [[case.variants]]
  name = "discount"
  vars = { old = "max_discount: float = 0.30", new = "max_discount: float = 0.25", target = "limit the discount to 25%" }
  expect = ["discount", "25"]

  [[case.variants]]
  name = "fee"
  split = "eval"
  vars = { old = "service_fee: float = 0.12", new = "service_fee: float = 0.15", target = "raise the service fee to 15%" }
  expect = ["fee|service", "15"]

  [[case.variants]]
  name = "name"
  vars = { old = "Corner Coffee", new = "Plaza Coffee", target = "rename the shop to Plaza Coffee" }
  expect = ["name|shop", "largo"]

[[case]]
id = "price"
title = "adjusts a price"
repo = "coffeeshop"
split = "train"
ops = [{ op = "replace", path = "src/coffeeshop/menu.py", old = "\"Croquette\", 8.00", new = "\"Croquette\", 8.50" }]
target = "raise the croquette price to 8.50"
expect = ["price|raise", "croquette"]
tags = ["config"]

[[case]]
id = "negative-discount"
title = "one-line bugfix"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "src/coffeeshop/order.py", old = "discount = min(self.discount, config.max_discount)", new = "discount = max(0.0, min(self.discount, config.max_discount))" }]
target = "stop a negative discount from applying to the order total"
expect = ["discount", "negativ"]
tags = ["bugfix"]

[[case]]
id = "docstring"
title = "new docstring"
repo = "coffeeshop"
split = "train"
ops = [{ op = "replace", path = "src/coffeeshop/order.py", old = "    def total(self, config: Config) -> float:\n", new = "    def total(self, config: Config) -> float:\n        \"\"\"Total with service fee and discount, rounded to cents.\"\"\"\n" }]
target = "document how the order total is computed"
expect = ["document|docstring|comment", "total"]
tags = ["comments"]

[[case]]
id = "comment"
title = "new comment"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "src/coffeeshop/stock.py", old = "        self.connection.execute(\n            \"insert into", new = "        # add to the quantity if the item already exists (upsert)\n        self.connection.execute(\n            \"insert into" }]
target = "comment the stock restock upsert"
expect = ["comment|explain|document", "upsert|restock|stock"]
tags = ["comments"]

[[case]]
id = "unused-import"
title = "removes an unused import"
repo = "coffeeshop"
split = "train"
ops = [{ op = "replace", path = "src/coffeeshop/cli.py", old = "import sys\n", new = "" }]
target = "remove unused import from the cli"
expect = ["import", "remov|drop"]
tags = ["cleanup"]

[[case]]
id = "default-argument"
title = "changes an argument default"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "src/coffeeshop/cli.py", old = "order.add_argument(\"--table\", type=int, default=1)", new = "order.add_argument(\"--table\", type=int, default=0)" }]
target = "orders without a table go to the counter (table 0)"
expect = ["table", "0|default|counter"]
tags = ["config"]

[[case]]
id = "gitignore"
title = ".gitignore"
repo = "coffeeshop"
split = "train"
ops = [{ op = "append", path = ".gitignore", text = "*.log\nbackups/\n" }]
target = "ignore logs and the backups folder"
expect = ["ignor", "log|backup"]
tags = ["config"]

[[case]]
id = "dependency-bump"
title = "updates a dependency"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "requirements.txt", old = "tabulate==0.9.0", new = "tabulate==0.9.1" }]
target = "update tabulate to 0.9.1"
expect = ["tabulate", "updat|0\\.9\\.1"]
tags = ["dependencies"]

[[case]]
id = "readme-line"
title = "one line in the README"
repo = "coffeeshop"
split = "train"
ops = [{ op = "append", path = "README.md", text = "\nTo copy the stock database, run `scripts/backup.sh`.\n" }]
target = "document the backup script in the README"
expect = ["readme|document", "backup"]
tags = ["docs"]

[[case]]
id = "reject-empty-name"
title = "new validation"
repo = "ledger"
split = "train"
ops = [{ op = "replace", path = "src/accounts.ts", old = "  open(name: string, kind: AccountKind): Account {\n", new = "  open(name: string, kind: AccountKind): Account {\n    if (!name.trim()) {\n      throw new Error(\"account names cannot be empty\");\n    }\n" }]
target = "fix(accounts): reject empty account names"
expect = ["^fix\\(accounts\\)|^feat\\(accounts\\)", "empty|blank"]
tags = ["bugfix"]

[[case]]
id = "dev-dependency-bump"
title = "updates a devDependency"
repo = "ledger"
split = "eval"
ops = [{ op = "replace", path = "package.json", old = "\"typescript\": \"5.6.3\"", new = "\"typescript\": \"5.7.2\"" }]
target = "chore(deps): bump typescript to 5.7.2"
expect = ["^chore\\(deps\\)|^build", "typescript"]
tags = ["dependencies"]

[[case]]
id = "small-method"
title = "new small method"
repo = "ledger"
split = "train"
ops = [{ op = "replace", path = "src/money.ts", old = "  isNegative(): boolean {", new = "  isZero(): boolean {\n    return this.cents === 0;\n  }\n\n  isNegative(): boolean {" }]
target = "feat(money): add isZero"
expect = ["^feat\\(money\\)", "zero"]
tags = ["feature"]

[[case]]
id = "rename-parameter"
title = "renames a parameter"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", path = "src/report.ts", pattern = "\\bwidth\\b", repl = "pad" }]
target = "refactor(report): rename width to pad"
expect = ["^refactor\\(report\\)", "width|pad|rename"]
tags = ["rename"]
