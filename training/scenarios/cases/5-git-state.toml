# Level 5: git states and unusual situations. Most targets depend on what
# the trace inputs do not record (a merge or revert in progress, a deletion
# left unstaged): tagged git-state, they only measure.
level = 5

[[case]]
id = "revert"
title = "git revert of the last commit"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [{ op = "git", args = ["revert", "--no-commit", "HEAD"] }]
target = "Revert \"configurable service fee and other minor tweaks\""
expect = ["revert"]
tags = ["git-state"]

[[case]]
id = "revert-conventional"
title = "git revert in a Conventional repo"
repo = "ledger"
split = "eval"
stage = "none"
ops = [{ op = "git", args = ["revert", "--no-commit", "HEAD"] }]
target = "Revert \"refactor(report): sort accounts by name\""
expect = ["revert"]
tags = ["git-state"]

[[case]]
id = "cherry-pick"
title = "cherry-pick from another branch"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [
  { op = "git", args = ["checkout", "-q", "-b", "seasonal", "HEAD~2"] },
  { op = "replace", path = "src/coffeeshop/menu.py", old = "    \"cake\":", new = "    \"iced-tea\": Item(\"iced-tea\", \"Iced hibiscus tea\", 7.00, \"drink\"),\n    \"cake\":" },
  { op = "git", args = ["commit", "-q", "-am", "iced tea on the summer menu"] },
  { op = "git", args = ["checkout", "-q", "main"] },
  { op = "git", args = ["cherry-pick", "-n", "{{commit:iced tea on the summer menu}}"] },
]
target = "iced tea on the summer menu"
expect = ["tea|hibiscus", "menu"]
tags = ["cherry-pick", "git-state"]

[[case]]
id = "merge-kept-ours"
title = "merge with a conflict resolved with our side"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [
  { op = "git", args = ["checkout", "-q", "-b", "discount"] },
  { op = "replace", path = "src/coffeeshop/config.py", old = "max_discount: float = 0.30", new = "max_discount: float = 0.50" },
  { op = "git", args = ["commit", "-q", "-am", "discount of up to 50%"] },
  { op = "git", args = ["checkout", "-q", "main"] },
  { op = "replace", path = "src/coffeeshop/config.py", old = "max_discount: float = 0.30", new = "max_discount: float = 0.20" },
  { op = "git", args = ["commit", "-q", "-am", "discount of up to 20%"] },
  { op = "git", args = ["merge", "-q", "discount"], check = false },
  { op = "git", args = ["checkout", "-q", "--ours", "src/coffeeshop/config.py"] },
  { op = "git", args = ["add", "-A"] },
]
target = "Merge branch 'discount'"
expect = ["merge", "discount"]
tags = ["git-state", "merge"]

[[case]]
id = "merge-took-theirs"
title = "merge with a conflict resolved with their side"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [
  { op = "git", args = ["checkout", "-q", "-b", "discount"] },
  { op = "replace", path = "src/coffeeshop/config.py", old = "max_discount: float = 0.30", new = "max_discount: float = 0.50" },
  { op = "git", args = ["commit", "-q", "-am", "discount of up to 50%"] },
  { op = "git", args = ["checkout", "-q", "main"] },
  { op = "replace", path = "src/coffeeshop/config.py", old = "max_discount: float = 0.30", new = "max_discount: float = 0.20" },
  { op = "git", args = ["commit", "-q", "-am", "discount of up to 20%"] },
  { op = "git", args = ["merge", "-q", "discount"], check = false },
  { op = "git", args = ["checkout", "-q", "--theirs", "src/coffeeshop/config.py"] },
  { op = "git", args = ["add", "-A"] },
]
target = "Merge branch 'discount'"
expect = ["merge", "discount"]
tags = ["git-state", "merge"]

[[case]]
id = "merge-clean"
title = "merge without conflict with --no-commit"
repo = "ledger"
split = "eval"
stage = "none"
ops = [
  { op = "git", args = ["checkout", "-q", "-b", "docs/cli"] },
  { op = "append", path = "docs/usage.md", text = "\nRun `ledger` without arguments to see the usage.\n" },
  { op = "git", args = ["commit", "-q", "-am", "docs: mention the usage message"] },
  { op = "replace", path = "README.md", old = "Amounts are kept in integer cents.", new = "Amounts are kept in integer cents, so sums never drift." },
  { op = "git", args = ["commit", "-q", "-am", "docs: explain integer cents"] },
  { op = "git", args = ["checkout", "-q", "main"] },
  { op = "git", args = ["merge", "-q", "--no-ff", "--no-commit", "docs/cli"] },
]
target = "Merge branch 'docs/cli'"
expect = ["merge"]
tags = ["git-state", "merge"]

[[case]]
id = "first-commit"
title = "first commit of a repository"
repo = "coffeeshop"
split = "eval"
history = false
ops = []
target = "initial commit"
expect = ["initial|first"]
tags = ["first-commit"]

[[case]]
id = "first-commit-conventional"
title = "first commit, no history to set the style"
repo = "ledger"
split = "train"
history = false
ops = []
target = "chore: initial commit"
expect = ["initial|inicial|first"]
tags = ["first-commit"]

[[case]]
id = "ticket-branch"
title = "branch with a ticket in a repo that uses no tickets"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "git", args = ["checkout", "-q", "-b", "feature/CAF-12-coupon"] },
  { op = "replace", path = "src/coffeeshop/order.py", old = "    discount: float = 0.0\n", new = "    discount: float = 0.0\n    coupon: str = \"\"\n" },
]
target = "coupon field on the order"
expect = ["coupon"]
tags = ["branch"]

[[case]]
id = "detached-head"
title = "detached HEAD"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "git", args = ["checkout", "-q", "--detach", "HEAD~1"] },
  { op = "replace", path = "src/coffeeshop/config.py", old = "currency: str = \"$\"", new = "currency: str = \"BRL\"" },
]
target = "currency becomes USD instead of $"
expect = ["currency|usd"]
tags = ["branch"]

[[case]]
id = "partial-stage"
title = "two changes in the file, only one staged"
repo = "coffeeshop"
split = "train"
stage = "none"
ops = [
  { op = "replace", path = "src/coffeeshop/order.py", old = "            raise ValueError(\"quantity must be positive\")", new = "            raise ValueError(f\"quantity must be positive: {quantity}\")" },
  { op = "git", args = ["add", "-A"] },
  { op = "replace", path = "src/coffeeshop/order.py", old = "    def subtotal(self) -> float:\n        return sum(", new = "    # TODO: store the subtotal instead of recomputing\n    def subtotal(self) -> float:\n        return sum(" },
]
target = "show the invalid quantity in the order error"
expect = ["quantity|error|message"]
tags = ["partial"]

[[case]]
id = "half-rename"
title = "mv without git: only the new file staged"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [
  { op = "move", from = "src/coffeeshop/cli.py", to = "src/coffeeshop/__main__.py" },
  { op = "git", args = ["add", "src/coffeeshop/__main__.py"] },
]
target = "rename cli.py to __main__.py"
expect = ["renam|mov", "main"]
tags = ["git-state", "rename"]

[[case]]
id = "deleted-then-recreated"
title = "deletion staged, file recreated unstaged"
repo = "coffeeshop"
split = "train"
stage = "none"
ops = [
  { op = "git", args = ["rm", "-q", "src/coffeeshop/stock.py"] },
  { op = "write", path = "src/coffeeshop/stock.py", text = "class Stock:\n    pass\n" },
]
target = "remove stock control"
expect = ["remov|delet|drop", "stock"]
tags = ["partial", "delete"]

[[case]]
id = "linguist-generated"
title = "file marked linguist-generated"
repo = "coffeeshop"
split = "eval"
ops = [
  { op = "write", path = ".gitattributes", text = "src/coffeeshop/generated_prices.py linguist-generated\n" },
  { op = "git", args = ["add", ".gitattributes"] },
  { op = "git", args = ["commit", "-q", "-m", "mark generated_prices.py as generated"] },
  { op = "write", path = "src/coffeeshop/generated_prices.py", text = "PRICE_{{i}} = {{i}}.50\n", repeat = 200 },
]
target = "generated price table"
expect = ["price|generat|table"]
tags = ["generated"]
