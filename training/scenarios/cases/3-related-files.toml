[[case]]
id = "rename-and-rewrite"
title = "rename with a rewrite: git sees a delete + a create"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "git", args = ["rm", "-q", "src/coffeeshop/config.py"] },
  { op = "write", path = "src/coffeeshop/settings.py", text = """\"\"\"Shop settings, read once at startup.\"\"\"

from typing import NamedTuple


class Settings(NamedTuple):
    shop_name: str = "Corner Coffee"
    currency: str = "$"
    service_fee: float = 0.12
    max_discount: float = 0.30
    stock_file: str = "stock.sqlite"


DEFAULTS = Settings()


def load(path: str) -> Settings:
    \"\"\"Reads the settings from a TOML; what is missing keeps the default.\"\"\"
    import tomllib

    with open(path, "rb") as file:
        data = tomllib.load(file)
    unknown = set(data) - set(Settings._fields)
    if unknown:
        raise ValueError(f"unknown settings: {sorted(unknown)}")
    return DEFAULTS._replace(**data)
""" },
  { op = "regex", paths = ["src/coffeeshop/*.py", "tests/*.py"], pattern = "from coffeeshop\\.config import Config", repl = "from coffeeshop.settings import Settings as Config", optional = true },
]
target = "replace config.py with settings.py, which also reads the settings from a TOML"
expect = ["settings|renam|replac|config"]
tags = ["rename"]

