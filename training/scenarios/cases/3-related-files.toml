[[case]]
id = "close-accounts"
title = "feature in two files"
repo = "ledger"
split = "eval"
ops = [
  { op = "replace", path = "src/accounts.ts", old = "  balance: Money;\n}", new = "  balance: Money;\n  closed?: boolean;\n}" },
  { op = "replace", path = "src/accounts.ts", old = "  all(): Account[] {", new = """  close(name: string): void {
    const account = this.get(name);
    if (account.balance.cents !== 0) {
      throw new Error(`cannot close ${name}: balance is ${account.balance}`);
    }
    account.closed = true;
  }

  all(): Account[] {""" },
  { op = "replace", path = "src/transactions.ts", old = "    const to = this.registry.get(transfer.to);\n", new = "    const to = this.registry.get(transfer.to);\n    if (from.closed || to.closed) {\n      throw new Error(\"transfers cannot touch a closed account\");\n    }\n" },
]
