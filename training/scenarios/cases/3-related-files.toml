[[case]]
id = "opening-hours"
title = "new module + use"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "write", path = "src/coffeeshop/hours.py", text = """from datetime import datetime, time

OPENS = time(7, 0)
CLOSES = time(19, 0)


def is_open(now: datetime) -> bool:
    \"\"\"The shop opens Monday to Saturday, from 7am to 7pm.\"\"\"
    return now.weekday() < 6 and OPENS <= now.time() < CLOSES
""" },
  { op = "replace", path = "src/coffeeshop/cli.py", old = "    if args.command == \"order\":\n", new = "    if args.command == \"order\":\n        if not is_open(datetime.now()):\n            sys.exit(\"shop closed\")\n" },
