[[case]]
id = "menu-command"
title = "feature in two files"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "append", path = "src/coffeeshop/menu.py", text = """

def formatted(currency: str) -> str:
    lines = []
    for category in ("drink", "savory", "sweet"):
        lines.append(category.upper())
        lines += [f"  {i.name:<26} {currency} {i.price:>5.2f}" for i in by_category(category)]
    return "\\n".join(lines)
""" },
  { op = "replace", path = "src/coffeeshop/cli.py", old = "    sub.add_parser(\"report\"", new = "    sub.add_parser(\"menu\", help=\"shows the menu with prices\")\n    sub.add_parser(\"report\"" },
  { op = "replace", path = "src/coffeeshop/cli.py", old = "    else:\n        print(\"no orders recorded today\")", new = "    elif args.command == \"menu\":\n        print(formatted(config.currency))\n    else:\n        print(\"no orders recorded today\")" },
  { op = "replace", path = "src/coffeeshop/cli.py", old = "from coffeeshop.config import Config\n", new = "from coffeeshop.menu import formatted\nfrom coffeeshop.config import Config\n" },
]
target = "command to show the menu with prices"
expect = ["menu", "command|show|list|display"]
tags = ["feature"]

[[case]]
id = "move-function"
title = "moves a function to a new module"
repo = "coffeeshop"
split = "eval"
ops = [
  { op = "replace", path = "src/coffeeshop/report.py", old = """

def receipt(order: Order, config: Config) -> str:
    template = (TEMPLATES / "receipt.txt").read_text()
    lines = "\\n".join(
        f"{l.quantity}x {l.item.name:<24} {config.currency} {l.subtotal:>6.2f}" for l in order.lines
    )
    return template.format(
        shop=config.shop_name, table=order.table, lines=lines,
        total=f"{config.currency} {order.total(config):.2f}",
    )
""", new = "" },
  { op = "write", path = "src/coffeeshop/receipt.py", text = """from pathlib import Path

from coffeeshop.config import Config
from coffeeshop.order import Order

TEMPLATES = Path(__file__).parent.parent.parent / "templates"


def receipt(order: Order, config: Config) -> str:
    template = (TEMPLATES / "receipt.txt").read_text()
    lines = "\\n".join(
        f"{l.quantity}x {l.item.name:<24} {config.currency} {l.subtotal:>6.2f}" for l in order.lines
    )
    return template.format(
        shop=config.shop_name, table=order.table, lines=lines,
        total=f"{config.currency} {order.total(config):.2f}",
    )
""" },
  { op = "replace", path = "src/coffeeshop/cli.py", old = "from coffeeshop.report import receipt", new = "from coffeeshop.receipt import receipt" },
]
target = "move the receipt into its own module"
expect = ["move|split|extract|module", "receipt"]
tags = ["move", "refactor"]

