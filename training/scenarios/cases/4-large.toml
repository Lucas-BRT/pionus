# Level 4: large or mechanical changes across many files, where the diff
# no longer fits the prompt.
level = 4

[[case]]
id = "quote-style"
title = "bulk formatting"
repo = "coffeeshop"
split = "train"
ops = [{ op = "regex", paths = ["src/coffeeshop/*.py", "tests/*.py"], pattern = "\"(?!\"\")([^\"\\n]*)\"", repl = "'\\1'", optional = true }]
target = "replace double quotes with single quotes across the code"
expect = ["quote|format|style"]
tags = ["formatting"]

[[case]]
id = "rename-package"
title = "renames the package (directory)"
repo = "coffeeshop"
split = "eval"
ops = [
  { op = "git", args = ["mv", "src/coffeeshop", "src/shop"] },
  { op = "regex", paths = ["src/shop/*.py", "tests/*.py", "README.md"], pattern = "\\bcoffeeshop\\.", repl = "shop.", optional = true },
]
target = "rename the package coffeeshop to shop"
expect = ["renam|mov", "shop"]
tags = ["rename"]

[[case]]
id = "license-header"
title = "license header on every file"
repo = "coffeeshop"
split = "train"
ops = [{ op = "prepend", paths = ["src/coffeeshop/*.py", "tests/*.py"], text = "# SPDX-License-Identifier: MIT\n" }]
target = "add an MIT license header to the files"
expect = ["licen|spdx|mit"]
tags = ["mechanical"]

[[case]]
id = "rename-symbol"
title = "renames a symbol used everywhere"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "regex", paths = ["src/coffeeshop/*.py", "tests/*.py"], pattern = "\\bOrder\\b", repl = "Ticket", optional = true }]
target = "rename Order to Ticket"
expect = ["ticket", "renam|order"]
tags = ["rename"]

[[case]]
id = "squash"
title = "squash of the last three commits"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [{ op = "git", args = ["reset", "-q", "--soft", "HEAD~3"] }]
target = "fix the cappuccino price, add the backup script and a 12% service fee"
expect = ["cappuccino|backup|fee"]
tags = ["squash"]

[[case]]
id = "mixed-purposes"
title = "three purposes mixed"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "replace", path = "src/coffeeshop/stock.py", old = "insufficent", new = "insufficient" },
  { op = "append", path = "src/coffeeshop/order.py", text = """
    def item_count(self) -> int:
        return sum(line.quantity for line in self.lines)
""" },
  { op = "append", path = "README.md", text = "\n## Tests\n\nRun `pytest` at the project root.\n" },
]
target = "count order items, fix the stock typo and document the tests"
expect = ["items|count|quantity", "typo|fix|stock", "test|readme|document"]
tags = ["mixed"]

[[case]]
id = "big-new-module"
title = "big new module"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "write", path = "src/coffeeshop/coupons.py", text = "from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Coupon:\n    code: str\n    discount: float\n    minimum: float\n\n\nCUPONS = {\n" },
  { op = "append", path = "src/coffeeshop/coupons.py", text = "    \"CAFE{{i}}\": Coupon(\"CAFE{{i}}\", discount=0.10, minimum={{i}}.0),\n", repeat = 120 },
  { op = "append", path = "src/coffeeshop/coupons.py", text = "}\n\n\ndef valid(code: str, subtotal: float) -> bool:\n    coupon = COUPONS.get(code)\n    return coupon is not None and subtotal >= coupon.minimum\n" },
]
target = "add discount coupons"
expect = ["coupon|discount"]
tags = ["new-file"]

[[case]]
id = "generated-plus-one-line"
title = "big minified file + one line"
repo = "coffeeshop"
split = "eval"
ops = [
  { op = "write", path = "web/menu.min.js", text = "var c{{i}}=[{{i}},\"item{{i}}\"];", repeat = 4000 },
  { op = "replace", path = "src/coffeeshop/config.py", old = "Corner Coffee", new = "Plaza Coffee" },
]
target = "rename the shop to Plaza Coffee"
expect = ["name|shop", "plaza"]
tags = ["generated"]

[[case]]
id = "new-package"
title = "package of new files"
repo = "coffeeshop"
split = "train"
ops = [
  { op = "write", path = "src/coffeeshop/payment/__init__.py", text = "\"\"\"Payment methods accepted at the counter.\"\"\"\n" },
  { op = "write", path = "src/coffeeshop/payment/base.py", text = "class PaymentMethod:\n    name = \"\"\n    fee = 0.0\n\n    def net(self, amount: float) -> float:\n        return round(amount * (1 - self.fee), 2)\n" },
  { op = "write", path = "src/coffeeshop/payment/pix.py", text = "from coffeeshop.payment.base import PaymentMethod\n\n\nclass Pix(PaymentMethod):\n    name = \"pix\"\n" },
  { op = "write", path = "src/coffeeshop/payment/card.py", text = "from coffeeshop.payment.base import PaymentMethod\n\n\nclass Credit(PaymentMethod):\n    name = \"credit\"\n    fee = 0.035\n\n\nclass Debit(PaymentMethod):\n    name = \"debit\"\n    fee = 0.015\n" },
  { op = "write", path = "src/coffeeshop/payment/cash.py", text = "from coffeeshop.payment.base import PaymentMethod\n\n\nclass Cash(PaymentMethod):\n    name = \"cash\"\n\n    def change(self, amount: float, paid: float) -> float:\n        if paid < amount:\n            raise ValueError(\"amount paid is less than the total\")\n        return round(paid - amount, 2)\n" },
  { op = "write", path = "src/coffeeshop/payment/voucher.py", text = "from coffeeshop.payment.base import PaymentMethod\n\n\nclass MealVoucher(PaymentMethod):\n    name = \"meal-voucher\"\n    fee = 0.06\n" },
]
target = "payment methods: pix, card, cash and meal voucher"
expect = ["payment|pix|card"]
tags = ["new-file", "feature"]

[[case]]
id = "delete-many"
title = "deletes several files"
repo = "coffeeshop"
split = "eval"
ops = [
  { op = "git", args = ["rm", "-q", "src/coffeeshop/stock.py", "scripts/backup.sh"] },
  { op = "replace", path = ".gitignore", old = "*.sqlite\n", new = "" },
  { op = "replace", path = "src/coffeeshop/config.py", old = "    stock_file: str = \"stock.sqlite\"\n", new = "" },
]
target = "remove stock control and the database backup"
expect = ["remov|delet|drop", "stock|backup"]
tags = ["delete"]

[[case]]
id = "lockfile-only"
title = "only the lockfile"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", path = "package-lock.json", pattern = "\"version\": \"6\\.19\\.8\"", repl = "\"version\": \"6.20.0\"" }]
target = "chore(deps): update lockfile"
expect = ["lock|deps|depend"]
tags = ["lockfile"]

[[case]]
id = "feature-tests-docs"
title = "feature + test + docs"
repo = "ledger"
split = "train"
ops = [
  { op = "append", path = "src/transactions.ts", text = """
/** The net amount that entered (positive) or left (negative) `account`. */
export function net(journal: Journal, account: string): Money {
  return journal.entries.reduce(
    (sum, t) => (t.to === account ? sum.plus(t.amount) : t.from === account ? sum.minus(t.amount) : sum),
    Money.fromCents(0),
  );
}
""" },
  { op = "append", path = "test/transactions.test.ts", text = """
test("net sums what came in and went out", () => {
  const registry = new Registry();
  registry.open("cash", "asset");
  registry.open("bank", "asset");
  const journal = new Journal(registry);
  journal.record({ from: "bank", to: "cash", amount: Money.parse("50"), memo: "atm", date: "2026-01-03" });
  journal.record({ from: "cash", to: "bank", amount: Money.parse("20"), memo: "deposit", date: "2026-01-04" });
  assert.equal(net(journal, "cash").toString(), "30.00");
});
""" },
  { op = "replace", path = "test/transactions.test.ts", old = "import { Journal } from \"../src/transactions.js\";", new = "import { Journal, net } from \"../src/transactions.js\";" },
  { op = "append", path = "docs/usage.md", text = "\n`net(journal, account)` gives what entered an account minus what left it.\n" },
]
target = "feat(transactions): add net amount per account"
expect = ["^feat\\(transactions\\)", "net"]
tags = ["feature", "tests", "docs"]

[[case]]
id = "rename-type-everywhere"
title = "renames a type across the project"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", paths = ["src/*.ts", "test/*.ts"], pattern = "\\bRegistry\\b", repl = "AccountBook", optional = true }]
target = "refactor(accounts): rename Registry to AccountBook"
expect = ["^refactor", "registry|accountbook|rename"]
tags = ["rename"]
