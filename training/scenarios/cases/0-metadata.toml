# Level 0: changes with little or no code meaning (typos, whitespace, line
# endings, file modes). The message must name what changed without
# inventing a behaviour.
level = 0

[[case]]
id = "typo-in-string"
title = "typo in an error message"
repo = "coffeeshop"
split = "train"
ops = [{ op = "replace", path = "src/coffeeshop/stock.py", old = "insufficent", new = "insufficient" }]
target = "fix typo in the insufficient stock message"
expect = ["typo|spell|fix", "stock|insufficient"]
tags = ["typo"]

[[case]]
id = "typo-in-comment"
title = "typo in a doc comment"
repo = "ledger"
split = "eval"
ops = [{ op = "replace", path = "src/report.ts", old = "per acount", new = "per account" }]
target = "docs(report): fix typo in balances comment"
expect = ["typo|spell", "^docs|^style|^chore"]
tags = ["typo", "comments"]

[[case]]
id = "trailing-whitespace"
title = "trailing whitespace removed"
repo = "coffeeshop"
split = "train"
ops = [{ op = "regex", path = "src/coffeeshop/cli.py", pattern = "[ \\t]+$", repl = "" }]
target = "remove trailing whitespace from the cli"
expect = ["whitespace|trailing"]
tags = ["whitespace"]

[[case]]
id = "wrap-long-line"
title = "only wraps a long line"
repo = "ledger"
split = "eval"
ops = [{ op = "replace", path = "src/report.ts", old = "  return [`${\"account\".padEnd(width)}  ${\"balance\".padStart(12)}`, ...accounts.map((a) => line(a, width))].join(\"\\n\");", new = """  const header = `${"account".padEnd(width)}  ${"balance".padStart(12)}`;
  return [header, ...accounts.map((a) => line(a, width))].join("\\n");""" }]
target = "style(report): split the long return line"
expect = ["^style|^refactor", "line|format|wrap|split"]
tags = ["formatting"]

[[case]]
id = "make-executable"
title = "only chmod +x"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "chmod", path = "scripts/backup.sh", mode = "755" }]
target = "make the backup script executable"
expect = ["executable|permission|chmod", "backup|script"]
tags = ["file-mode"]

[[case]]
id = "final-newline"
title = "adds the final newline"
repo = "coffeeshop"
split = "train"
ops = [{ op = "append", path = "requirements.txt", text = "\n" }]
target = "add a final newline to requirements.txt"
expect = ["newline|line", "requirements"]
tags = ["whitespace"]

[[case]]
id = "normalize-line-endings"
title = "CRLF to LF"
repo = "ledger"
split = "eval"
ops = [{ op = "regex", path = "tsconfig.json", pattern = "\\r$", repl = "" }]
target = "chore: normalize line endings in tsconfig.json"
expect = ["line ending|crlf|lf|newline", "tsconfig"]
tags = ["whitespace"]

[[case]]
id = "empty-marker-file"
title = "new empty file"
repo = "coffeeshop"
split = "train"
ops = [{ op = "write", path = "src/coffeeshop/py.typed", text = "" }]
target = "mark the package as typed with py.typed"
expect = ["py.?typed|typed"]
tags = ["new-file"]

[[case]]
id = "symlink"
title = "new symlink"
repo = "ledger"
split = "eval"
ops = [{ op = "symlink", path = "ledger", target = "dist/index.js" }]
target = "chore: add a ledger symlink to the built CLI"
expect = ["link|symlink", "^chore|^build"]
tags = ["file-mode", "new-file"]

[[case]]
id = "nothing-staged"
title = "nothing staged"
repo = "coffeeshop"
split = "eval"
stage = "none"
ops = [{ op = "replace", path = "src/coffeeshop/config.py", old = "0.30", new = "0.25" }]
outcome = "error"
target = ""
