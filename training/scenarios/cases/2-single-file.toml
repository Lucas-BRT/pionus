[[case]]
id = "new-test-file"
title = "new test file"
repo = "coffeeshop"
split = "train"
ops = [{ op = "write", path = "tests/test_menu.py", text = """import pytest

from coffeeshop.menu import find, by_category


def test_find_known_item():
    assert find("coffee").price == 6.00


def test_unknown_item_raises():
    with pytest.raises(ValueError):
        find("pizza")


def test_drinks():
    assert {item.code for item in by_category("drink")} == {
        "coffee", "espresso", "cappuccino", "tea",
    }
""" }]
target = "tests for the menu"
expect = ["test", "menu"]
tags = ["tests"]

