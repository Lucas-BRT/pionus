[[case]]
id = "rewrite-function"
title = "rewrites a function"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "src/coffeeshop/menu.py", old = """def find(code: str) -> Item:
    try:
        return MENU[code]
    except KeyError:
        raise ValueError(f"unknown item: {code}") from None""", new = """def find(code: str) -> Item:
    key = code.strip().lower().replace(" ", "-")
    item = MENU.get(key)
    if item is None:
        raise ValueError(f"unknown item: {code}")
    return item""" }]
target = "menu lookup ignores case and spaces"
expect = ["lookup|find|code", "case|space|normaliz"]
