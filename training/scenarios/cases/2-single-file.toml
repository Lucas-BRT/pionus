  { op = "replace", path = "src/coffeeshop/menu.py", old = "def by_category(category: str) -> list[Item]:\n", new = "def by_category(category: str) -> list[Item]:\n    \"\"\"The items of a category, in menu order.\"\"\"\n" },
]
