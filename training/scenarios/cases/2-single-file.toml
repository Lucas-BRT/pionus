# Level 2: one file, ten to a hundred lines.
level = 2

[[case]]
id = "new-methods"
title = "new methods"
repo = "coffeeshop"
split = "train"
ops = [{ op = "append", path = "src/coffeeshop/order.py", text = """
    def item_count(self) -> int:
        return sum(line.quantity for line in self.lines)

    def empty(self) -> bool:
        return not self.lines
""" }]
target = "add an item count to the order"
expect = ["count|quantity|items", "order|empty"]
tags = ["feature"]

[[case]]
id = "delete-method"
title = "deletes a method"
repo = "coffeeshop"
split = "eval"
ops = [{ op = "replace", path = "src/coffeeshop/order.py", old = """    def remove(self, code: str) -> None:
        self.lines = [l for l in self.lines if l.item.code != code]

""", new = "" }]
target = "remove the remove method from the order"
expect = ["remov|delet|drop", "remove|method"]
tags = ["cleanup"]

[[case]]
id = "new-query"
title = "new query"
repo = "coffeeshop"
split = "train"
ops = [{ op = "append", path = "src/coffeeshop/stock.py", text = """
    def below_minimum(self, minimum: int) -> list[tuple[str, int]]:
        \"\"\"Items with fewer than `minimum` units, scarcest first.\"\"\"
        return self.connection.execute(
            "select code, quantity from stock where quantity < ? order by quantity",
            (minimum,),
        ).fetchall()
""" }]
target = "list the items below the minimum stock"
expect = ["minimum|below|low", "stock|items"]
tags = ["feature"]

