[package]
name = "pionus-website"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Website for pionus, built with Topcoat"

[dependencies]
# Pinned exactly: Topcoat is early-stage and breaks between releases.
topcoat = { version = "=0.11.0", features = ["tailwind", "ui", "icon-iconify"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"

[build-dependencies]
topcoat = { version = "=0.11.0", default-features = false, features = ["tailwind", "icon-iconify"] }
